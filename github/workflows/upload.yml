# On-Demand Video Uploader — triggered ONLY by the Cloudflare Worker (workflow_dispatch).
# It never runs on a schedule by itself, so no minutes are wasted.
# Secrets live in GitHub repo Settings -> Secrets and variables -> Actions. Never in code.
# Repo should be PUBLIC for unlimited free minutes (code contains no secrets).
name: On-Demand Video Uploader
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Cloudflare Worker run id (locks exactly this run's jobs)"
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Libraries
        run: pip install gdown requests google-api-python-client google-auth-oauthlib
      - name: Run Uploader & Report Back to Cloudflare D1
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUN_ID: ${{ inputs.run_id }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
          TIKTOK_MODE: "INBOX"
          TIKTOK_PRIVACY: "SELF_ONLY"
          YT_1_CLIENT_ID: ${{ secrets.YT_1_CLIENT_ID }}
          YT_1_CLIENT_SECRET: ${{ secrets.YT_1_CLIENT_SECRET }}
          YT_1_REFRESH_TOKEN: ${{ secrets.YT_1_REFRESH_TOKEN }}
          YT_2_CLIENT_ID: ${{ secrets.YT_2_CLIENT_ID }}
          YT_2_CLIENT_SECRET: ${{ secrets.YT_2_CLIENT_SECRET }}
          YT_2_REFRESH_TOKEN: ${{ secrets.YT_2_REFRESH_TOKEN }}
          YT_3_CLIENT_ID: ${{ secrets.YT_3_CLIENT_ID }}
          YT_3_CLIENT_SECRET: ${{ secrets.YT_3_CLIENT_SECRET }}
          YT_3_REFRESH_TOKEN: ${{ secrets.YT_3_REFRESH_TOKEN }}
          YT_4_CLIENT_ID: ${{ secrets.YT_4_CLIENT_ID }}
          YT_4_CLIENT_SECRET: ${{ secrets.YT_4_CLIENT_SECRET }}
          YT_4_REFRESH_TOKEN: ${{ secrets.YT_4_REFRESH_TOKEN }}
          YT_5_CLIENT_ID: ${{ secrets.YT_5_CLIENT_ID }}
          YT_5_CLIENT_SECRET: ${{ secrets.YT_5_CLIENT_SECRET }}
          YT_5_REFRESH_TOKEN: ${{ secrets.YT_5_REFRESH_TOKEN }}
          FB_1_PAGE_ID: ${{ secrets.FB_1_PAGE_ID }}
          FB_1_TOKEN: ${{ secrets.FB_1_TOKEN }}
          FB_2_PAGE_ID: ${{ secrets.FB_2_PAGE_ID }}
          FB_2_TOKEN: ${{ secrets.FB_2_TOKEN }}
          FB_3_PAGE_ID: ${{ secrets.FB_3_PAGE_ID }}
          FB_3_TOKEN: ${{ secrets.FB_3_TOKEN }}
          FB_4_PAGE_ID: ${{ secrets.FB_4_PAGE_ID }}
          FB_4_TOKEN: ${{ secrets.FB_4_TOKEN }}
          FB_5_PAGE_ID: ${{ secrets.FB_5_PAGE_ID }}
          FB_5_TOKEN: ${{ secrets.FB_5_TOKEN }}
          IG_1_USER_ID: ${{ secrets.IG_1_USER_ID }}
          IG_1_TOKEN: ${{ secrets.IG_1_TOKEN }}
          IG_2_USER_ID: ${{ secrets.IG_2_USER_ID }}
          IG_2_TOKEN: ${{ secrets.IG_2_TOKEN }}
          IG_3_USER_ID: ${{ secrets.IG_3_USER_ID }}
          IG_3_TOKEN: ${{ secrets.IG_3_TOKEN }}
          IG_4_USER_ID: ${{ secrets.IG_4_USER_ID }}
          IG_4_TOKEN: ${{ secrets.IG_4_TOKEN }}
          IG_5_USER_ID: ${{ secrets.IG_5_USER_ID }}
          IG_5_TOKEN: ${{ secrets.IG_5_TOKEN }}
          TT_1_TOKEN: ${{ secrets.TT_1_TOKEN }}
          TT_2_TOKEN: ${{ secrets.TT_2_TOKEN }}
          TT_3_TOKEN: ${{ secrets.TT_3_TOKEN }}
          TT_4_TOKEN: ${{ secrets.TT_4_TOKEN }}
          TT_5_TOKEN: ${{ secrets.TT_5_TOKEN }}
        run: python uploader.py
